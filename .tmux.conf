unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix
# Don't wait for an escape sequence to resolve; improves perceived input latency.
set -sg escape-time 0
set -g mouse on
set -g focus-events on
set-option -g history-limit 1000
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r y resize-pane -L 5
bind -r u resize-pane -D 5
bind -r i resize-pane -U 5
bind -r o resize-pane -R 5

# Match the selected terminal theme.
source-file ~/.config/terminal-style/current/theme.tmux
set -g default-terminal tmux-256color
set -s terminal-features[10] 'xterm-ghostty:RGB'
set -g base-index 0
setw -g pane-base-index 0
set -g status-position bottom
set -g status-justify left
set -g status-left ''
set -g status-right-length 22
set -g status-interval 1
setw -g window-status-separator '  '
setw -g automatic-rename on
setw -g pane-border-style 'fg=colour8'
setw -g pane-active-border-style 'fg=colour8'
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string '#{b:pane_current_path} — tmux — #{client_width}×#{client_height}'
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
